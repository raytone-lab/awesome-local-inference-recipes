name: Recipe submission / 提交配方
description: Add a model × engine × hardware result with its source.
title: "[recipe] <model> on <hardware>"
labels: [recipe]
body:
  - type: markdown
    attributes:
      value: "Only fill what the source shows. Unknown → leave blank (null). 只填来源写明的内容，未知留空。"
  - type: markdown
    attributes:
      value: "Focus: new models and new hardware in the first few weeks after launch, and non-mainstream combinations (multi-GPU, multi-machine, AMD and Apple mixes, budget builds). A routine repeat recipe (a model × engine × hardware combination that is already in the list) is not a new entry. We merge it into the existing entry and replace its numbers, source and date. 收录重点：新模型和新硬件发布后几周内的配方，以及非主流组合（多卡、多机、AMD 与 Apple 混搭、预算受限的配置）。常规重复配方（库里已有的「模型 × 引擎 × 硬件」组合）不作为新条目，会合并进已有条目并替换其数字、来源和日期。"
  - type: input
    id: source_url
    attributes: { label: Source URL / 来源链接, placeholder: "https://x.com/... or HF model card" }
    validations: { required: true }
  - type: dropdown
    id: category
    attributes: { label: Category / 类别, options: [text, image, video/audio] }
    validations: { required: true }
  - type: input
    id: model
    attributes: { label: Model (+ quant) / 模型（量化）, placeholder: "Qwen3.8-27B UD-Q4_K_XL" }
    validations: { required: true }
  - type: input
    id: engine
    attributes: { label: Engine + version / 引擎及版本, placeholder: "llama.cpp b6800" }
  - type: input
    id: hardware
    attributes: { label: Hardware / 硬件, placeholder: "RTX 3090 24GB + 64GB DDR5" }
    validations: { required: true }
  - type: input
    id: metric
    attributes: { label: Result / 结果, placeholder: "42 tok/s decode @ 8K ctx; or 1024² in 3.1 s" }
    validations: { required: true }
  - type: dropdown
    id: level
    attributes: { label: Source level / 来源等级, options: ["measured (实测)", "official (官方)", "claimed (宣称)"] }
    validations: { required: true }
  - type: textarea
    id: command
    attributes: { label: Launch command (optional) / 启动命令（可选）, render: shell }
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: Numbers are copied from the source, not estimated. 数字来自原文，未估算。
          required: true
