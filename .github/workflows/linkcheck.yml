name: linkcheck
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source URLs
        run: python3 -c "import json;print('\n'.join(sorted({r['source_url'] for r in json.load(open('data/recipes.json'))}|{s['url'] for s in json.load(open('data/sources.json'))['sources']})))" > urls.txt
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          # Accept 403/429: some sites block anonymous fetches.
          args: --no-progress --max-concurrency 4 --max-retries 3 --timeout 30 --accept 200..=299,403,429 urls.txt docs/*.md recipes/*.md
          fail: false
          output: lychee/out.md
      - name: Fail on lychee error
        # Exit code 2 means broken links. Other nonzero codes mean lychee failed.
        if: steps.lychee.outputs.exit_code != 0 && steps.lychee.outputs.exit_code != 2
        run: |
          echo "::error::lychee failed with exit code ${{ steps.lychee.outputs.exit_code }}. No links were checked."
          exit 1
      - name: Open or update the link issue
        if: steps.lychee.outputs.exit_code == 2 && hashFiles('lychee/out.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -s lychee/out.md ]; then
            echo "::error::lychee reported broken links but lychee/out.md is empty."
            exit 1
          fi
          gh label create links --color d73a4a --description "Broken source links" 2>/dev/null || true
          num=$(gh issue list --label links --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file lychee/out.md
            gh issue comment "$num" --body "Link check run ${{ github.run_id }} updated the report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --title "Broken source links (weekly link check)" --label links --body-file lychee/out.md
          fi
